version: 2
listen: 127.0.0.1:8080
read_only: true
token_store: /etc/hostlens/secrets/tokens.json
profile_dir: /etc/hostlens/profiles
active_profiles: [host]
docker_socket: ""
observer_socket: /run/hostlens-observer/observer.sock
repair_socket: /run/hostlens-repair/repair.sock
# Set these numeric IDs to match the dedicated service accounts before starting.
gateway_uid: 1001
observer_uid: 1002
repair_uid: 0
shared_gid: 1001
token_gid: 1002
