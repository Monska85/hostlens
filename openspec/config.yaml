schema: spec-driven
context: |
  HostLens is a Go MCP server for live Linux host, systemd, and local Docker status.
  The official Go MCP SDK derives typed tool contracts. Read-only mode is the
  default. Opt-in repair runs in a separate identity and is limited to exact
  systemd service and Docker container restarts with live revalidation.
  Linux amd64 and arm64 are supported now. Shared authorization and protocol
  code must remain portable for future macOS and Windows adapters.
  docs/current/VALIDATION.md records validation evidence and limitations. Never invent
  observations or substitute unavailable values. Activated YAML profiles grant
  tools and resources; matching denials always win. Keep implementation tasks
  unchecked until behavior and validation are complete.
rules:
  specs:
    - Include observable acceptance scenarios and failure paths for every requirement.
    - Distinguish unavailable data from failed collection and preserve partial coverage.
  tasks:
    - Run every executable test in disposable containers by default. Never test privileged lifecycle on the administrator host. A strictly necessary VM requires explicit confirmation before provisioning, downloading, or starting it.
