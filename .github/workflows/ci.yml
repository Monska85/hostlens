name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_validation:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !inputs.release_validation && github.ref_type != 'tag' }}

jobs:
  checks:
    name: Source, private fixtures, and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3-venv
          make deps
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true
      - name: Select candidate version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.1.0-dev
          if [ "${REF_TYPE}" = tag ]; then
            version=$(python3 -B tools/release/prepare.py version -- "${REF_NAME#v}")
          fi
          printf 'HOSTLENS_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Prepare disposable check image
        run: make test-image
      - name: Formatting and static analysis
        run: make fmt-check lint
      - name: Race tests, vet, contracts, and portable builds
        run: make test
      - name: Dependency vulnerability scan
        run: make scan-vulnerabilities
      - name: Prepare pinned private Docker fixtures
        run: make prepare-live-docker
      - name: Test private Docker observation and restart
        run: make test-live-docker
      - name: Validate release configuration
        run: make release-check
      - name: Build exact Linux candidates
        run: make package
      - name: Verify archive members and checksums
        run: make verify-archives
      - name: Prepare disposable systemd image
        run: make systemd-image
      - name: Test amd64 install and repair in systemd container
        run: make test-systemd
      - name: Include standalone MCP contract asset
        run: |
          cp dist/linux-amd64/tools.json "dist/archives/hostlens-${HOSTLENS_VERSION}-tools.json"
          (cd dist/archives && sha256sum "hostlens-${HOSTLENS_VERSION}-tools.json" >> checksums.txt)
          (cd dist/archives && sha256sum --check --strict checksums.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-candidate
          path: |
            dist/archives/*.tar.gz
            dist/archives/*.txt
            dist/archives/*.json
          if-no-files-found: error
          retention-days: 7

  native-arm64:
    name: Native arm64 candidate
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-candidate
          path: dist/archives
      - name: Select candidate version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.1.0-dev
          if [ "${REF_TYPE}" = tag ]; then
            version=$(python3 -B tools/release/prepare.py version -- "${REF_NAME#v}")
          fi
          printf 'HOSTLENS_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Verify native architecture
        run: test "$(scripts/container-arch.sh)" = arm64
      - name: Prepare disposable systemd image
        run: make systemd-image
      - name: Test arm64 install and repair in systemd container
        run: make test-systemd

  gate:
    name: CI gate
    needs: [checks, native-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both candidate checks
        env:
          CHECKS: ${{ needs.checks.result }}
          ARM64: ${{ needs.native-arm64.result }}
        run: |
          printf 'CI gate: checks=%s native_arm64=%s\n' "$CHECKS" "$ARM64"
          test "$CHECKS" = success
          test "$ARM64" = success
