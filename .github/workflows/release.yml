name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag in default branch history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -B tools/release/prepare.py version -- "${RELEASE_TAG#v}"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
          printf 'PASS: %s belongs to %s history; full candidate validation follows\n' "${RELEASE_TAG}" "${DEFAULT_BRANCH}"
  validate:
    needs: eligibility
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: true
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-candidate
          path: dist/archives
      - name: Upload verified archives to a draft release
        working-directory: dist/archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          sha256sum "hostlens-${version}-linux-amd64.tar.gz" "hostlens-${version}-linux-arm64.tar.gz" | sort >/tmp/hostlens-expected-checksums
          sort checksums.txt | diff /tmp/hostlens-expected-checksums -
          set -- "hostlens-${version}-linux-amd64.tar.gz" "hostlens-${version}-linux-arm64.tar.gz" checksums.txt
          for asset do test -f "${asset}"; done
          case "${version}" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "${RELEASE_TAG}" "$@" --verify-tag --draft --generate-notes
          printf 'PASS: uploaded tested archives to draft %s\n' "${RELEASE_TAG}"
