name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag in default branch history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 -B tools/release/prepare.py version -- "${RELEASE_TAG#v}"
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
          printf 'PASS: %s belongs to %s history; full candidate validation follows\n' "${RELEASE_TAG}" "${DEFAULT_BRANCH}"
  validate:
    needs: eligibility
    uses: ./.github/workflows/ci.yml
    with:
      release_validation: true
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-candidate
          path: dist/archives
      - name: Report attestation availability
        if: github.event.repository.private
        run: |
          printf '%s\n' 'UNAVAILABLE: GitHub build provenance attestations are not available for this private user-owned repository; assets stay checksum-verified and attestations begin recording when the repository goes public.' >&2
      - name: Record build provenance for the release assets
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/archives/hostlens-*-linux-amd64.tar.gz
            dist/archives/hostlens-*-linux-arm64.tar.gz
            dist/archives/checksums.txt
      - name: Upload verified archives to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            printf 'FAIL: release %s already exists (draft or published); a retried run must not create a duplicate. Reuse, extend, or delete that release explicitly.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          # Release notes come from the hand-maintained CHANGELOG section for
          # this version; --generate-notes would reduce them to a commit list.
          notes=$(awk -v ver="${version}" 'index($0, "## " ver " ") == 1 {flag = 1; next} /^## / {flag = 0} flag' "${GITHUB_WORKSPACE}/CHANGELOG.md")
          if [ -z "${notes}" ]; then
            printf 'FAIL: CHANGELOG.md has no ## %s section; release notes must come from the changelog.\n' "${version}" >&2
            exit 1
          fi
          cd "${GITHUB_WORKSPACE}/dist/archives"
          sha256sum "hostlens-${version}-linux-amd64.tar.gz" "hostlens-${version}-linux-arm64.tar.gz" | sort >/tmp/hostlens-expected-checksums
          sort checksums.txt | diff /tmp/hostlens-expected-checksums -
          set -- "hostlens-${version}-linux-amd64.tar.gz" "hostlens-${version}-linux-arm64.tar.gz" checksums.txt
          for asset do test -f "${asset}"; done
          case "${version}" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "${RELEASE_TAG}" "$@" --verify-tag --draft --notes "${notes}"
          printf 'PASS: uploaded tested archives to draft %s\n' "${RELEASE_TAG}"
